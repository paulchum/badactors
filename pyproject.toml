[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "badactors"
version = "0.1.0"
description = "AI social-deduction arena where frontier-model agents play a hidden-role game and the audience watches them lie."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "anyio",
  "fastapi",
  "httpx",
  "pydantic>=2",
  "uvicorn",
]

[project.scripts]
castle-game = "badactors.castle.cli:main"
make-clips = "badactors.clips.detect:main"
run-game = "badactors.runner:main"
run-season = "badactors.season:main"

[dependency-groups]
dev = [
  "hypothesis",
  "mypy",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/badactors"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unused_configs = true
