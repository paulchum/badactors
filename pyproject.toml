[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "badactors"
dynamic = ["version"]
description = "AI models play a murder game in a castle, and every lie they tell gets caught on tape."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "paulchum" }]
keywords = ["ai", "llm", "game", "social-deduction", "deception", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "anyio>=4.14.2",
  "fastapi",
  "httpx",
  "pydantic>=2",
  "uvicorn",
]

[project.urls]
Homepage = "https://paulchum.github.io/badactors/"
Repository = "https://github.com/paulchum/badactors"
Issues = "https://github.com/paulchum/badactors/issues"
Standings = "https://paulchum.github.io/badactors/?page=leaderboard"

[project.scripts]
castle-bench = "badactors.bench.cli:main"
castle-clips = "badactors.castle.clips:main"
castle-game = "badactors.castle.cli:main"
castle-live = "badactors.castle.live:main"
castle-power = "badactors.castle.power:main"
castle-qualify = "badactors.castle.qualify:main"
castle-sweep = "badactors.castle.sweep:main"
castle-verify = "badactors.castle.verify:main"

[dependency-groups]
dev = [
  "hypothesis",
  "mypy",
  "pip-audit>=2.10.1",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.hatch.version]
path = "src/badactors/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/badactors"]

[tool.hatch.build.targets.sdist]
include = ["/src/badactors", "/README.md", "/LICENSE", "/CITATION.cff"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
warn_unused_configs = true
