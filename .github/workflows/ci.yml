name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - run: uv sync
      - run: ruff check
      - run: ruff format --check
      - run: mypy src
      - run: pytest -q
      - run: castle-game --seed 7 --highlights --verdicts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      # The tests and the build export the bundled games from the engine first.
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: uv sync
        working-directory: .
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  clips:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clips/render
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clips/render/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
